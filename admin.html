<body class="admin">

<a class="skip" href="#main">Skip to the enquiries</a>

<!-- Shown until the browser has asked the server whether this session is
     signed in. Without it the sign-in form flashes up for anybody who is
     already signed in, once per page load. -->
<div class="ad-boot" id="boot" aria-live="polite">
  <span class="ad-spin" aria-hidden="true"></span>
  <p>Checking…</p>
</div>

<!-- ─────────────────────────── sign in ─────────────────────────── -->
<main class="ad-gate" id="gate" hidden>
  <form class="ad-card" id="signin" novalidate>
    <svg class="ad-mark" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 1.6c-1.7 2.3-.5 3.6.5 4.4" stroke="#E8461C" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M4 39V19.6C4 11 11.2 4.2 20 4.2S36 11 36 19.6V39z" fill="#E8461C"/>
      <g fill="#FCF8F0">
        <path d="M20 10.8c2.5 0 4.5 2 4.5 4.5v3.8h-9v-3.8c0-2.5 2-4.5 4.5-4.5z"/>
        <rect x="8.6" y="24" width="6.3" height="9.4" rx="3.15"/>
        <rect x="16.85" y="24" width="6.3" height="9.4" rx="3.15"/>
        <rect x="25.1" y="24" width="6.3" height="9.4" rx="3.15"/>
      </g>
      <circle cx="30.6" cy="14.4" r="4" fill="#2C6E80"/>
      <path d="M27.3 13.4c1.7.7 3.3-.5 4.9.3" stroke="#7FBF4F" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>Enquiries</h1>
    <p class="ad-sub">Everyone who has written in from the Take part page.</p>

    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>

    <button class="btn" type="submit" id="signin-go" style="justify-content:center;width:100%">
      Sign in
    </button>
    <p class="ad-msg" id="gate-msg" role="status" aria-live="polite"></p>
    <p class="ad-back"><a href="index.html">Back to the site</a></p>
  </form>
</main>

<!-- ─────────────────────────── the console ─────────────────────────── -->
<div class="ad-app" id="app" hidden>

  <header class="ad-top">
    <div class="ad-top-in">
      <a class="ad-home" href="index.html" aria-label="Back to the site">
        <svg viewBox="0 0 40 40" aria-hidden="true" width="26" height="26">
          <path d="M4 39V19.6C4 11 11.2 4.2 20 4.2S36 11 36 19.6V39z" fill="#E8461C"/>
          <g fill="#FCF8F0">
            <rect x="8.6" y="24" width="6.3" height="9.4" rx="3.15"/>
            <rect x="16.85" y="24" width="6.3" height="9.4" rx="3.15"/>
            <rect x="25.1" y="24" width="6.3" height="9.4" rx="3.15"/>
          </g>
        </svg>
        <span>Enquiries</span>
      </a>
      <div class="ad-top-acts">
        <a class="ad-btn" id="export" href="/api/admin/export" download>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 1.5v8m0 0L5 6.5m3 3 3-3M2 11.5v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2"/></svg>
          <span>Spreadsheet</span>
        </a>
        <button class="ad-btn" id="signout" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="ad-wrap">

      <section class="ad-stats" id="stats" aria-label="Totals"></section>

      <section class="ad-filters" aria-label="Filter the enquiries">
        <div class="ad-pills" id="pills" role="group" aria-label="Status"></div>
        <div class="ad-tools">
          <label class="ad-search">
            <span class="vh">Search enquiries</span>
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="7" cy="7" r="4.6"/><path d="m10.4 10.4 3.1 3.1"/></svg>
            <input id="q" type="search" placeholder="Name, phone, school, anything they wrote"
                   autocomplete="off" enterkeyhint="search">
          </label>
          <label class="ad-select">
            <span class="vh">Who is writing</span>
            <select id="as"><option value="">Everyone</option></select>
          </label>
          <label class="ad-select">
            <span class="vh">Order</span>
            <select id="sort">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="largest">Most people first</option>
              <option value="name">By name</option>
            </select>
          </label>
        </div>
      </section>

      <p class="ad-count" id="count" role="status" aria-live="polite"></p>
      <div class="ad-list" id="list"></div>

      <nav class="ad-pager" id="pager" aria-label="Pages" hidden>
        <button class="ad-btn" type="button" data-step="-1">Newer</button>
        <span id="pager-at"></span>
        <button class="ad-btn" type="button" data-step="1">Older</button>
      </nav>

    </div>
  </main>
</div>
